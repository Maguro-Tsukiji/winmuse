# winmuse server configuration — example
#
# Copy to:  %LOCALAPPDATA%\winmuse\config.toml
# (override the location with the WINMUSE_CONFIG environment variable)
#
# There is NO default profile. If this file is missing or `profile`
# is unset, the server starts in `observe` (read-only) and says so.

# Choose exactly one:  observe | guided | full
#
#   observe  screenshots and window listing only; all input refused
#   guided   input allowed only into the apps listed below
#   full     no allowlist checks (today's behavior)
profile = "guided"

# Optional bearer token. When set, clients must send
# "Authorization: Bearer <token>" (client.py: --token or the
# WINMUSE_TOKEN environment variable; the legacy CU_BRIDGE_TOKEN
# also works). When unset, tailnet
# membership is the only access control. The Settings GUI can
# generate one for you.
# auth_token = "<random hex>"

[guided]
# Process names, with the .exe extension (as shown by Task
# Manager; note PowerShell's Get-Process shows the name WITHOUT
# .exe, so append it — a bare "chrome" matches nothing) that
# input may land in. Pointer input is checked against the window under the
# target point; keyboard input against the foreground window.
# Terminals, Explorer and password managers do NOT belong here
# unless you accept that the agent can reach local files through
# them.
allow_processes = [
    "chrome.exe",
    # "Code.exe",
]

# Block Windows-key shortcuts (Win+R, Win+E, ...) in guided mode.
block_win_keys = true

[consent]
# If true, operation_begin waits for the PC's user to press F9
# (ESC denies) before any input is accepted.
require_local_arm = false

[audit]
# Append-only JSONL log of every tool call and its decision.
# Location: %LOCALAPPDATA%\winmuse\audit.jsonl — never in temp.
enabled = true

[server]
# Bind address and port. Default: the machine's Tailscale address
# (100.64.0.0/10) on port 18081, falling back to 127.0.0.1 when no
# tailnet address exists. The WINMUSE_HOST / WINMUSE_PORT
# environment variables override these.
# host = "100.x.x.x"
# port = 18081

[overlay]
# The operation overlay (glow frame + toast).
enabled = true
# Toast language: "" (follow the OS), "ja", or "en".
lang = ""
# Custom toast text for the active state; empty = built-in wording.
# title = ""
# sub = ""
